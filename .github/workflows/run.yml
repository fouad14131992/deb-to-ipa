name: Run

on:
  workflow_dispatch:
    inputs:
      deb:
        description: "Direct URL to deb file"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Download deb
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/app.deb" "${{ github.event.inputs.deb }}"
          file "$RUNNER_TEMP/app.deb"
          if ! file "$RUNNER_TEMP/app.deb" | grep -qi "Debian binary package"; then
            echo "::error::The URL did not return a valid .deb file. Make sure it is a DIRECT download link."
            exit 1
          fi

      - name: Convert deb to IPA
        id: convert
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/ipa/Payload"
          dpkg-deb -x "$RUNNER_TEMP/app.deb" "$RUNNER_TEMP/app"

          # .app bundles can live in /Applications, /var/jb/Applications, etc.
          mapfile -t APPS < <(find "$RUNNER_TEMP/app" -maxdepth 5 -type d -name "*.app")
          if [ "${#APPS[@]}" -eq 0 ]; then
            echo "::error::No .app bundle found inside the deb (it is probably a tweak, not an app)."
            exit 1
          fi
          for a in "${APPS[@]}"; do
            echo "Found: $a"
            cp -R "$a" "$RUNNER_TEMP/ipa/Payload/"
          done

          # Strip old signature / provisioning so the IPA can be re-signed
          rm -rf "$RUNNER_TEMP"/ipa/Payload/*.app/_CodeSignature
          rm -f  "$RUNNER_TEMP"/ipa/Payload/*.app/embedded.mobileprovision

          NAME="$(basename "${APPS[0]}" .app)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/$NAME.ipa" Payload
          ls -lh "$RUNNER_TEMP/$NAME.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.convert.outputs.name }}-ipa
          path: ${{ runner.temp }}/${{ steps.convert.outputs.name }}.ipa
          if-no-files-found: error
